# The bench's overrides for the services project: the game-facing ports on localhost beside the live bench's, and the
# TS index on the host for the sub-requests of a batch that are not ported yet (bench only: the port is not finished;
# nothing TS ships in this infrastructure). Use with the services file:
#
#   docker compose -f deploy/services/compose.yaml -f deploy/bench/compose.override.yaml up -d
#
# deploy/bench/bench-compose.sh does that with the bench's variables set.

services:
  router:
    ports: !override
      - "127.0.0.1:${OVS_GAME_PORT:-18300}:8000"
  edge:
    ports: !override
      - "127.0.0.1:${OVS_EDGE_PORT:-13301}:3001"
  http:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      Batch__TsUrl: http://host.docker.internal:18100
  # The live bench's own relay holds 57000; these two come up only with --profile relay.
  relay:
    profiles: [relay]
  rendezvous:
    profiles: [relay]
