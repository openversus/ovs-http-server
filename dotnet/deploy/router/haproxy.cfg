# Generated by deploy/router/generate.py from docs/routes.json. Do not edit; regenerate.
# 247 paths: 189 exact, 58 templates; unlisted paths go to http.

global
    log stdout format raw local0
    maxconn 4096

# Compose recreates a service container with a new address; the names are resolved through Docker's DNS as they
# change, not once at startup.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold obsolete 10s

defaults
    mode http
    log global
    option httplog
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    # The game holds long polls and large hiss answers; the services, not the router, decide how long a request may take.

frontend game
    bind *:8000
    # The services take the client's address from X-Real-IP (else X-Forwarded-Host, else the last X-Forwarded-For hop),
    # and bans key off it. Nothing sits ahead of this router, so what the client sent in those headers is dropped
    # and the connection's own address written; forwardfor then appends it as the one X-Forwarded-For hop.
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request set-header X-Real-IP %[src]
    # The services' health endpoints are for Docker and the router, not the public.
    http-request deny status 404 if { path_beg /health/ }

    # Exact paths first, one ACL per owner.
    acl exact_access path /access /sessions/auth/password /sessions/auth/token /sessions/device
    acl exact_lobbies path /ssc/invoke/add_custom_game_bot /ssc/invoke/autoparty_join /ssc/invoke/bot_queue /ssc/invoke/cancel_party_invite /ssc/invoke/casual_queue /ssc/invoke/create_arena_lobby /ssc/invoke/create_custom_game_lobby /ssc/invoke/create_party
    acl exact_lobbies path /ssc/invoke/create_party_lobby /ssc/invoke/create_rift_lobby /ssc/invoke/decline_party_invite /ssc/invoke/invite_to_party /ssc/invoke/invite_to_player_lobby /ssc/invoke/join_custom_game_lobby /ssc/invoke/join_party /ssc/invoke/join_party_lobby
    acl exact_lobbies path /ssc/invoke/kick_from_lobby /ssc/invoke/leave_party /ssc/invoke/leave_player_lobby /ssc/invoke/lobby_code /ssc/invoke/lock_lobby_loadout /ssc/invoke/lock_rift_lobby_loadout /ssc/invoke/notify_changing_modes /ssc/invoke/promote_to_lobby_leader
    acl exact_lobbies path /ssc/invoke/rematch_accept /ssc/invoke/rematch_decline /ssc/invoke/reset_custom_lobby_to_defaults /ssc/invoke/set_enabled_maps_for_custom_game /ssc/invoke/set_game_mode_for_custom_game /ssc/invoke/set_joinable /ssc/invoke/set_lobby_joinable /ssc/invoke/set_lobby_not_joinable
    acl exact_lobbies path /ssc/invoke/set_mode_for_lobby /ssc/invoke/set_player_handicap_for_custom_game /ssc/invoke/set_ready_for_lobby /ssc/invoke/set_world_buffs_for_custom_game /ssc/invoke/start_custom_match /ssc/invoke/switch_custom_game_lobby_team /ssc/invoke/update_custom_game_bot_fighter /ssc/invoke/update_int_setting_for_custom_game
    acl exact_lobbies path /ssc/invoke/update_party_game_modes /ssc/invoke/update_team_style_for_custom_game
    acl exact_matchflow path /api/ovs_match_status /mvsi_end_match /mvsi_register /ovs_end_match /ovs_match_inputs /ovs_match_started /ovs_match_status /ovs_node_config
    acl exact_matchflow path /ovs_p2p_failed /ovs_p2p_ready /ovs_register /ssc/invoke/check_training_server_ready /ssc/invoke/faceoff_timeout /ssc/invoke/get_or_create_my_match_config /ssc/invoke/match_set_absent /ssc/invoke/match_set_checkin
    acl exact_matchflow path /ssc/invoke/match_set_concede /ssc/invoke/perks_absent /ssc/invoke/perks_lock /ssc/invoke/sync_match_config /ssc/invoke/toast_player
    acl exact_social path /accounts/me/relationships /friends/me /friends/me/invitations /friends/me/invitations/incoming /friends/me/invitations/outgoing /ovs/friends/accept /ovs/friends/block /ovs/friends/decline
    acl exact_social path /ovs/friends/request /relationships/followers /social/me/blocked /ssc/invoke/follow_account
    acl exact_web path /account/switch /account/verify /admin/banner /api/admin/banner /api/admin/banner/online-count /api/identify /api/matches /assets/openversus-update-required-keyart.png
    acl exact_web path /assets/openversus-update-required-thumbnail.png /favicon.ico /home /leaderboard /matches /namechange /ovs/all-players /ovs/client-version
    acl exact_web path /ovs/notifications /stats /syncAsset /theme.css /theme.js

    # Then templates: a {segment} matches one path segment.
    acl tmpl_access path_reg ^/[^/]+/access$
    acl tmpl_lobbies path_reg ^/matches/all/[^/]+$
    acl tmpl_lobbies path_reg ^/matches/matchmaking/request/[^/]+/cancel$
    acl tmpl_lobbies path_reg ^/matches/matchmaking/[^/]+/request$
    acl tmpl_lobbies path_reg ^/matches/[^/]+$
    acl tmpl_lobbies path_reg ^/matches/[^/]+/leave$
    acl tmpl_social path_reg ^/accounts/me/relationships/[^/]+/block$
    acl tmpl_social path_reg ^/accounts/me/relationships/[^/]+/unblock$
    acl tmpl_social path_reg ^/accounts/me/relationships/[^/]+/unfollow$
    acl tmpl_social path_reg ^/accounts/[^/]+/relationships/followers$
    acl tmpl_social path_reg ^/friends/me/invitations/[^/]+/accept$
    acl tmpl_social path_reg ^/friends/me/invitations/[^/]+/cancel$
    acl tmpl_social path_reg ^/friends/me/invitations/[^/]+/decline$
    acl tmpl_social path_reg ^/friends/me/unfriend/[^/]+$
    acl tmpl_social path_reg ^/ovs/friends/send\-request/[^/]+$
    acl tmpl_social path_reg ^/ovs/friends/[^/]+$
    acl tmpl_social path_reg ^/social/me/block/[^/]+$
    acl tmpl_social path_reg ^/social/me/unblock/[^/]+$
    acl tmpl_web path_reg ^/api/leaderboard/[^/]+$
    acl tmpl_web path_reg ^/api/leaderboard/[^/]+/me$
    acl tmpl_web path_reg ^/favicon/[^/]+$
    acl tmpl_web path_reg ^/images/[^/]+$

    use_backend access if exact_access
    use_backend lobbies if exact_lobbies
    use_backend matchflow if exact_matchflow
    use_backend social if exact_social
    use_backend web if exact_web
    use_backend access if tmpl_access
    use_backend lobbies if tmpl_lobbies
    use_backend social if tmpl_social
    use_backend web if tmpl_web
    default_backend http

backend http
    option httpchk GET /health/live
    server http http:8000 check inter 5s fall 3 rise 2 resolvers docker init-addr libc,none

backend access
    option httpchk GET /health/live
    server access access:8001 check inter 5s fall 3 rise 2 resolvers docker init-addr libc,none

backend social
    option httpchk GET /health/live
    server social social:8002 check inter 5s fall 3 rise 2 resolvers docker init-addr libc,none

backend lobbies
    option httpchk GET /health/live
    server lobbies lobbies:8003 check inter 5s fall 3 rise 2 resolvers docker init-addr libc,none

backend web
    option httpchk GET /health/live
    server web web:8004 check inter 5s fall 3 rise 2 resolvers docker init-addr libc,none

backend matchflow
    option httpchk GET /health/live
    server matchflow matchflow:8005 check inter 5s fall 3 rise 2 resolvers docker init-addr libc,none
